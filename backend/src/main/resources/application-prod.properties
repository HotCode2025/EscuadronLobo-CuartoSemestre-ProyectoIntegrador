# ========================================
# CONFIGURACIÓN DE PRODUCCIÓN PARA RENDER
# ========================================

# Puerto dinámico de Render
server.port=${PORT:8080}
# Escuchar en todas las interfaces de red (necesario para Render)
server.address=0.0.0.0

# Conexión a PostgreSQL (Render proporciona credenciales por separado)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wolfforge}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate para producción
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Deshabilitar logs verbosos de desarrollo
logging.level.org.springframework.security=INFO
logging.level.ar.com.wolfforge=INFO
logging.level.org.springframework.web=WARN

# JWT Secret (se obtiene de variable de entorno)
jwt.secret=${JWT_SECRET:miClaveSuperSecretaDe32CaracteresMinimo123!}

# URL del frontend (para CORS) - se obtiene de variable de entorno
frontend.url=${FRONTEND_URL}

# Swagger (documentación de API)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ========================================
# CONFIGURACIÓN DE MERCADO PAGO
# ========================================
# Proyecto académico: siempre se usan credenciales de PRUEBA (sandbox) de
# Mercado Pago, nunca credenciales reales. Se obtienen de variable de entorno
# por seguridad (no quedan hardcodeadas en el repo).

mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN}

# URLs de retorno después del pago (apuntan al FRONTEND en Render)
mercadopago.url.success=${FRONTEND_URL}/pago/success
mercadopago.url.failure=${FRONTEND_URL}/pago/failure
mercadopago.url.pending=${FRONTEND_URL}/pago/pending

# URL del frontend, adonde el backend redirige después de recibir la vuelta de MP
app.frontend-url=${FRONTEND_URL}

# URL del webhook (apunta al BACKEND en Render, que ya tiene HTTPS automático)
mercadopago.webhook.url=${BACKEND_URL}/api/webhooks/mercadopago/notificacion

# Clave secreta del webhook (validación de firma HMAC-SHA256)
mercadopago.webhook.secret=${MERCADOPAGO_WEBHOOK_SECRET:}

# ========================================
# CONFIGURACIÓN DE SPRING BOOT ACTUATOR
# ========================================
# Necesario para el health check de Render
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
