# Render Blueprint para WolfForge
# Despliega backend (Spring Boot + Docker), frontend (Vue, static site) y la base
# de datos PostgreSQL con un solo click, usando como base el render.yaml de
# tienda-libro (mismo stack) y el patrón de rewrite SPA usado en CapyGaming.

databases:
  - name: wolfforge-db
    databaseName: wolfforge
    user: wolfforge_user
    plan: free
    region: oregon
    ipAllowList: [] # permite conexiones desde cualquier IP (lo necesita Render)

services:
  # 1. Backend (Spring Boot, se buildea con el Dockerfile que ya existe en /backend)
  - type: web
    name: wolfforge-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Base de datos (vinculada al servicio PostgreSQL de arriba)
      - key: DB_HOST
        fromDatabase:
          name: wolfforge-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: wolfforge-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: wolfforge-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: wolfforge-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: wolfforge-db
          property: password

      # JWT (Render genera un valor aleatorio seguro)
      - key: JWT_SECRET
        generateValue: true

      # URLs propias — ajustar si Render asigna otro nombre de servicio
      - key: FRONTEND_URL
        value: https://wolfforge-frontend.onrender.com
      - key: BACKEND_URL
        value: https://wolfforge-backend.onrender.com

      # Mercado Pago (configurar manualmente en el panel de Render después del deploy).
      # WolfForge es un proyecto académico: siempre se usan credenciales de PRUEBA
      # (sandbox) de Mercado Pago, nunca credenciales reales de producción.
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false

  # 2. Frontend (Vue 3 + Vite, se sirve como sitio estático)
  - type: web
    name: wolfforge-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://wolfforge-backend.onrender.com
    routes:
      # Vue Router usa modo history: sin esta regla, refrescar cualquier ruta
      # que no sea "/" (ej. /herramienta/5) devuelve un 404 de Render en vez
      # de servir index.html y dejar que el router resuelva la ruta.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
